<?xml version="1.0" encoding="UTF-8"?>
<!-- AlienFix icon: a stylised keyboard keycap with a soft RGB glow. Original artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="glow" cx="64" cy="70" r="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5ee7ff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#8a5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f3a"/>
      <stop offset="1" stop-color="#15171d"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d4352"/>
      <stop offset="1" stop-color="#262a34"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ee7ff"/>
      <stop offset="0.5" stop-color="#8a5cff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
  </defs>
  <!-- glow under the key -->
  <ellipse cx="64" cy="76" rx="60" ry="46" fill="url(#glow)"/>
  <!-- keycap body -->
  <rect x="18" y="26" width="92" height="82" rx="16" fill="url(#side)"/>
  <!-- lit rim where the LED shines through -->
  <rect x="18" y="26" width="92" height="82" rx="16" fill="none" stroke="url(#edge)" stroke-width="3"/>
  <!-- keycap top (dished) -->
  <rect x="28" y="30" width="72" height="62" rx="11" fill="url(#top)"/>
  <rect x="28" y="30" width="72" height="62" rx="11" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
  <!-- legend: a ripple, the app's typing effect -->
  <circle cx="64" cy="61" r="6" fill="#5ee7ff"/>
  <circle cx="64" cy="61" r="14" fill="none" stroke="#5ee7ff" stroke-opacity="0.7" stroke-width="3"/>
  <circle cx="64" cy="61" r="22" fill="none" stroke="#8a5cff" stroke-opacity="0.45" stroke-width="2.5"/>
</svg>
