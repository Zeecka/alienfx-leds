<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- alienfixd: only root may own the name; anyone may *call* the lighting
     interface, and the daemon asks polkit before doing anything. -->
<busconfig>
  <policy user="root">
    <allow own="io.github.zeecka.AlienFix"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.zeecka.AlienFix" send_interface="io.github.zeecka.AlienFix1"/>
    <allow send_destination="io.github.zeecka.AlienFix" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.zeecka.AlienFix" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
