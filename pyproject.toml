[project]
name = "alienfx-leds"
version = "0.1.0"
description = "Keyboard and chassis lighting for Alienware and Dell machines on Linux: a confined D-Bus service and its command line"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Zeecka" }]
requires-python = ">=3.10"
dependencies = ["PyGObject>=3.42"]
keywords = ["alienware", "dell", "rgb", "keyboard", "lighting", "linux", "d-bus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

[project.urls]
Homepage = "https://github.com/Zeecka/alienfx-leds"
Issues = "https://github.com/Zeecka/alienfx-leds/issues"

[project.scripts]
alienfix = "alienfix.cli:main"
alienfixd = "alienfix.daemon:main"

[dependency-groups]
dev = [
    "pygobject-stubs>=2.13",
    "pylint>=4.0",
    "ruff>=0.15",
    "ty>=0.0.17",
]

[build-system]
requires = ["uv_build>=0.10,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "alienfix"

# ---- lint ---------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py310"
extend-include = ["gui/alienfx-leds", "bin/alienfix", "bin/alienfixd"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "RUF001",   # "×", "–" in user-facing text are meant
    "SIM105",   # try/except/pass reads fine for "file may be absent"
    "SIM108",   # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"bin/*" = ["E402"]                         # sys.path first, then the import
"gui/alienfx-leds" = ["E402"]              # gi.require_version() must run before the imports
"tests/*" = ["E402"]
"tools/*" = ["E402"]
"tools/import_models.py" = ["E402", "E501"]   # long source strings of third-party data

[tool.pylint.main]
py-version = "3.10"
ignore-paths = ["tools/import_models.py"]  # one-off importer of third-party files, run by hand

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
disable = [
    # conventions this project does not follow on purpose
    "missing-module-docstring", "missing-class-docstring", "missing-function-docstring",
    "invalid-name",                    # m_SetKeys etc. carry the D-Bus method names
    "wrong-import-position", "import-outside-toplevel",
    # design metrics: the D-Bus verbs take many arguments by definition
    "too-many-arguments", "too-many-positional-arguments", "too-many-locals", "too-many-branches",
    "too-many-instance-attributes", "too-few-public-methods", "too-many-statements",
    "too-many-public-methods", "too-many-lines", "duplicate-code",
    # handled by ruff
    "line-too-long", "unused-import", "consider-using-f-string",
    # false positives
    "no-member", "no-name-in-module",  # GObject introspection is dynamic
    "arguments-out-of-order",          # starlight fades c2 -> c1 on purpose
    "implicit-str-concat",             # HID descriptors are written field by field
    "unused-argument",                 # D-Bus and GTK callbacks have fixed signatures
    "broad-exception-caught",          # workers and dispatch must keep serving
]

# ---- types ----------------------------------------------------------------

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src", "tests"]
