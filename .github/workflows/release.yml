# Release: push a tag "vX.Y.Z" matching the version in pyproject.toml.
#
#   build ─┬─> github-release ──> provenance (SLSA level 3) ──> pypi
#
# - build: sdist + wheel, and their SHA-256 for the provenance.
# - github-release: a GitHub release for the tag, with the sdist and wheel.
# - provenance: slsa-framework/slsa-github-generator (generic generator)
#   signs a SLSA v1 provenance of both files and attaches it to the release
#   (*.intoto.jsonl). Check it with slsa-verifier.
# - pypi: Trusted Publishing (OIDC, no token), with PEP 740 attestations.
#
# One-time setup (see README, "Releasing"):
# - PyPI: add a trusted publisher for project "alienfx-leds", repository
#   Zeecka/alienfx-leds, workflow "release.yml", environment "pypi".
# - GitHub: create the "pypi" environment (Settings > Environments).
# - The provenance is written to the public Rekor transparency log: the
#   generator refuses to run on a private repository unless
#   "private-repository: true" is set below. Make the repository public first.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv version --short)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match version $version in pyproject.toml"
            exit 1
          fi
      - run: uv build
      - run: uvx twine check --strict dist/*.whl dist/*.tar.gz
      - name: SHA-256 of the distributions
        id: hash
        run: |
          cd dist
          echo "hashes=$(sha256sum ./*.whl ./*.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Create the release with the sdist and wheel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag

  provenance:
    name: SLSA provenance
    needs: [build, github-release]
    permissions:
      actions: read          # read the workflow run
      id-token: write        # sign the provenance (Sigstore)
      contents: write        # attach it to the release
    # Reusable workflows must be referenced by tag, not SHA, for the
    # provenance to be verifiable.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true
      provenance-name: alienfx-leds.intoto.jsonl

  pypi:
    name: Publish to PyPI
    needs: [build, provenance]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/alienfx-leds/
    permissions:
      id-token: write        # Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
